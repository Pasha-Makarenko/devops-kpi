services:
  db:
    image: mariadb:11
    container_name: mywebapp-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE: mywebapp
      MARIADB_USER: mywebapp
      MARIADB_PASSWORD: secret
    volumes:
      - mywebapp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mywebapp-net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mywebapp-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: 5200
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: mywebapp
      DB_PASSWORD: secret
      DB_NAME: mywebapp
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mywebapp-net

  nginx:
    image: nginx:1.27-alpine
    container_name: mywebapp-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/mywebapp-docker.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mywebapp-net

networks:
  mywebapp-net:
    name: mywebapp-net
    driver: bridge

volumes:
  mywebapp-db-data:
    name: mywebapp-db-data
